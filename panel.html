<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYNI — production panel</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0b0b0d; --panel:#131317; --panel2:#191920; --line:#26262e;
  --text:#e9e9ee; --dim:#8d8d98; --dimmer:#5d5d68;
  --focus:#f2f2f7;
  --planned:#4a4a55; --prompted:#6f6f80; --queued:#c9a227; --done:#4a90d9;
  --approved:#3fa66b; --rejected:#c9484b; --escape:#9a6bd0; --post:#d0873f;
  --tierA:#ff9db1; --tierB:#9fc7ef; --tierC:#9ed3ac;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------------------------------------------------------------- chrome */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:0 14px;height:44px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim)}
nav{display:flex;gap:2px}
nav button{background:none;border:0;padding:6px 11px;border-radius:4px;color:var(--dim);
  cursor:pointer;letter-spacing:.03em}
nav button:hover{color:var(--text);background:var(--panel2)}
nav button[aria-current="true"]{color:var(--text);background:var(--panel2);
  box-shadow:inset 0 -2px 0 var(--done)}
nav button u{text-decoration:none;color:var(--dimmer)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:11px}
.dot{width:7px;height:7px;border-radius:99px;background:var(--dimmer)}
.dot.on{background:var(--approved)}
.dot.busy{background:var(--queued)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  color:var(--dim);padding:4px 9px;cursor:pointer}
.iconbtn:hover{color:var(--text)}

main{padding:0}
.view{display:none}
.view.active{display:block}

/* ---------------------------------------------------------------- filters */
.filters{position:sticky;top:44px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;padding:8px 14px;background:rgba(11,11,13,.94);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:5px 12px;color:var(--dim);
  cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}
select{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:5px 8px}
label.f{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.08em}
.count{color:var(--dim);font-size:11px}

/* ------------------------------------------------------------------- grid */
.grid{display:grid;gap:10px;padding:10px 14px 120px;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media (max-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;overflow:hidden;scroll-margin:120px}
.tile.cursor{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
.tile .media{position:relative;background:#000;aspect-ratio:16/9;display:block;width:100%}
.tile .media img,.tile .media video{width:100%;height:100%;object-fit:contain;display:block}
.tile .nomedia{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:var(--dimmer);font-size:11px}
.badges{position:absolute;top:6px;left:6px;display:flex;gap:5px;align-items:center;
  pointer-events:none}
.badges .r{position:absolute}
.shotid{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;
  background:rgba(0,0,0,.72);padding:4px 7px;border-radius:3px}
.tier{font:600 10px/1 ui-monospace,Menlo,monospace;padding:4px 6px;border-radius:3px;
  background:rgba(0,0,0,.72)}
.tier.A{color:var(--tierA)} .tier.B{color:var(--tierB)} .tier.C{color:var(--tierC)}
.topright{position:absolute;top:6px;right:6px;display:flex;gap:5px;align-items:center}
.state{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 7px;border-radius:3px;background:rgba(0,0,0,.72)}
.state.planned{color:var(--planned)} .state.prompted{color:var(--prompted)}
.state.queued{color:var(--queued)} .state.done{color:var(--done)}
.state.approved{color:var(--approved)} .state.rejected{color:var(--rejected)}
.state.escape_hatch{color:var(--escape)} .state.fix_in_post{color:var(--post)}
.flagbadge{background:rgba(0,0,0,.72);color:#ffd166;padding:4px 6px;border-radius:3px;
  font-size:10px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;
  border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.meta .desc{flex:1 1 140px;color:var(--dimmer);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.attempts{font-family:ui-monospace,Menlo,monospace}
.attempts.cap{color:var(--rejected)}
.codes{display:flex;gap:4px;flex-wrap:wrap}
.code{font:600 10px/1 ui-monospace,Menlo,monospace;padding:3px 5px;border-radius:3px;
  background:#2c1b1d;color:#ff9d9d;border:1px solid #452427}
.actions{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;border-top:1px solid var(--line);
  background:var(--panel2)}
.actions button{background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:4px 8px;color:var(--dim);cursor:pointer;font-size:11px}
.actions button:hover{color:var(--text);border-color:#3a3a45}
.actions button.go{border-color:#2f4c33;color:#9ed3ac}
.actions button.warn{border-color:#4a2c2e;color:#ff9d9d}
.actions .cost{margin-left:auto;color:var(--dimmer);font-size:11px;align-self:center}
.route{display:flex;gap:8px;align-items:center;padding:6px 8px;font-size:11px;
  border-top:1px solid var(--line);background:#1b1720;color:#c7b3e0}
.route span{flex:1}
.route b{color:#e0d0f5;font-weight:600}
.route .chip{white-space:nowrap;flex:0 0 auto}
.capnote{padding:5px 8px;border-top:1px solid var(--line);background:#231a13;
  color:#e3b98a;font-size:11px}

/* --------------------------------------------------------------- coverage */
.wrap{padding:14px 14px 80px}
.section{margin-bottom:18px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;overflow:hidden}
.section h2{margin:0;padding:9px 12px;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);
  background:var(--panel2)}
.section .body{padding:10px 12px}
.covscroll{overflow-x:auto}
table.cov{border-collapse:collapse;font-size:11px}
table.cov th{position:sticky;left:0;background:var(--panel);text-align:right;
  padding:3px 10px 3px 12px;color:var(--dim);font-weight:600;white-space:nowrap;z-index:2}
table.cov td{padding:2px}
.cell{width:74px;height:34px;border-radius:3px;border:1px solid var(--line);
  background:var(--panel2);display:flex;flex-direction:column;justify-content:center;
  gap:2px;padding:3px 5px;cursor:pointer;position:relative}
.cell:hover{border-color:#3f3f4a}
.cell .cid{font:600 9px/1 ui-monospace,Menlo,monospace;color:var(--dim);
  letter-spacing:.06em}
.cell .bars{display:flex;gap:2px}
.cell .bar{height:4px;flex:1;border-radius:2px;background:#2a2a33}
.cell.gap{border-color:#5a2b2d;background:#1d1416}
.cell .tt{position:absolute;left:0;top:100%;z-index:9;display:none;width:230px;
  background:#000;border:1px solid var(--line);border-radius:4px;padding:7px 9px;
  color:var(--dim);font-size:11px;text-align:left}
.cell:hover .tt{display:block}
.gaplist{display:flex;flex-direction:column;gap:8px}
.gaprow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.gaprow:last-child{border-bottom:0;padding-bottom:0}
.gapname{width:230px;flex:0 0 auto;color:var(--text)}
.gapname small{display:block;color:var(--dimmer);font-size:10px;line-height:1.3}
.gapn{font-family:ui-monospace,Menlo,monospace;min-width:28px}
.gapn.zero{color:var(--dimmer)}
.gapn.hit{color:#ff9d9d}
.chips{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.chip{font:600 10px/1 ui-monospace,Menlo,monospace;background:var(--panel2);
  border:1px solid var(--line);border-radius:3px;padding:4px 6px;color:var(--dim);
  cursor:pointer}
.chip:hover{color:var(--text);border-color:#3f3f4a}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:11px;
  padding:8px 12px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ------------------------------------------------------------ queue/ledger */
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{text-align:left;color:var(--dim);font-weight:600;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;
  border-bottom:1px solid var(--line)}
table.data td{padding:6px 10px;border-bottom:1px solid #1d1d24;color:var(--dim)}
table.data tr:last-child td{border-bottom:0}
table.data td.k{color:var(--text)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  padding:12px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px}
.stat .n{font:600 22px/1.1 ui-monospace,Menlo,monospace}
.stat .l{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  margin-top:5px}
.stat.warn .n{color:#e3b98a}
.hist{display:flex;flex-direction:column;gap:5px;padding:12px}
.hbar{display:grid;grid-template-columns:44px 1fr 34px;gap:9px;align-items:center}
.hbar .hcode{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--dim)}
.hbar .htrack{height:18px;background:#0f0f13;border:1px solid var(--line);
  border-radius:3px;overflow:hidden;position:relative}
.hbar .hfill{display:block;height:100%;background:#2f5f8f}
.hbar.video .hfill{background:#75407a}
.hbar .hlabel{position:absolute;left:7px;top:0;line-height:18px;font-size:10px;
  color:var(--text);white-space:nowrap}
.hbar .hn{text-align:right;font-family:ui-monospace,Menlo,monospace;color:var(--dim)}
.log{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);
  max-height:230px;overflow:auto;padding:8px 12px}
.log div{padding:1px 0;white-space:pre-wrap}
.log .err{color:#ff9d9d}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px}
.toolrow button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:6px 11px;color:var(--text);cursor:pointer}
.toolrow button:hover{border-color:#3f3f4a}
.issue{display:grid;grid-template-columns:52px 92px 132px 1fr;gap:8px;padding:4px 12px;
  font-size:11px;border-bottom:1px solid #1d1d24}
.issue .lvl{font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.issue.error .lvl{color:#ff9d9d} .issue.warn .lvl{color:#e3b98a}

/* ------------------------------------------------------------------ modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;display:none;
  padding:40px 16px;overflow:auto}
.scrim.open{display:block}
.modal{max-width:880px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;overflow:hidden}
.modal header{position:static;height:auto;padding:10px 14px;justify-content:space-between}
.modal .body{padding:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12px}
.kv dt{color:var(--dim)} .kv dd{margin:0;color:var(--text);word-break:break-word}
pre.json{background:#0d0d11;border:1px solid var(--line);border-radius:4px;padding:10px;
  overflow:auto;max-height:300px;font-size:11px;color:var(--dim)}
.tl{border-left:1px solid var(--line);margin-left:6px;padding-left:12px}
.tl div{padding:3px 0;font-size:11px;color:var(--dim)}
.tl b{color:var(--text);font-weight:600}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:3px;padding:1px 6px;font:600 11px/1.5 ui-monospace,Menlo,monospace;
  color:var(--text)}
.keys{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:12px;
  align-items:baseline}
.keys div:nth-child(even){color:var(--dim)}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;
  background:#000;border:1px solid var(--line);border-radius:4px;padding:8px 14px;
  font-size:12px;max-width:80vw;display:none}
.toast.show{display:block}
.toast.bad{border-color:#5a2b2d;color:#ff9d9d}
.empty{padding:60px 14px;text-align:center;color:var(--dimmer)}
</style>
</head>
<body>

<header>
  <span class="brand" id="brand">AYNI · panel</span>
  <nav>
    <button data-tab="coverage" aria-current="false"><u>C</u>overage</button>
    <button data-tab="review" aria-current="true"><u>R</u>eview</button>
    <button data-tab="queue" aria-current="false"><u>Q</u>ueue</button>
    <button data-tab="ledger" aria-current="false"><u>L</u>edger</button>
  </nav>
  <span class="spacer"></span>
  <span class="pill" id="runnerPill"><span class="dot" id="runnerDot"></span>
    <span id="runnerText">runner —</span></span>
  <button class="iconbtn" id="helpBtn" title="Keyboard help (?)">?</button>
</header>

<main>
  <!-- ------------------------------------------------------------ REVIEW -->
  <section class="view active" id="view-review">
    <div class="filters">
      <div class="seg" role="group" aria-label="Stage">
        <button data-stage="image" aria-pressed="true">Stills</button>
        <button data-stage="video" aria-pressed="false">Clips</button>
      </div>
      <label class="f">State <select id="fState"></select></label>
      <label class="f">Tier <select id="fTier"></select></label>
      <label class="f">Scene <select id="fScene"></select></label>
      <label class="f">Code <select id="fCode"></select></label>
      <label class="f"><input type="checkbox" id="fFlag"> flagged only</label>
      <span class="spacer"></span>
      <span class="count" id="reviewCount"></span>
      <button class="iconbtn" id="refreshBtn" title="Refresh (.)">↻</button>
    </div>
    <div class="grid" id="reviewGrid"></div>
  </section>

  <!-- ---------------------------------------------------------- COVERAGE -->
  <section class="view" id="view-coverage">
    <div class="wrap">
      <div class="section">
        <h2>Gaps</h2>
        <div class="body"><div class="gaplist" id="gapList"></div></div>
      </div>
      <div class="section">
        <h2>Scenes × shots</h2>
        <div class="covscroll"><div class="body"><table class="cov"><tbody id="covBody">
        </tbody></table></div></div>
        <div class="legend">
          <span><i style="background:var(--planned)"></i>planned</span>
          <span><i style="background:var(--prompted)"></i>prompted</span>
          <span><i style="background:var(--queued)"></i>queued</span>
          <span><i style="background:var(--done)"></i>awaiting review</span>
          <span><i style="background:var(--approved)"></i>approved</span>
          <span><i style="background:var(--rejected)"></i>rejected</span>
          <span><i style="background:var(--escape)"></i>escape hatch</span>
          <span><i style="background:var(--post)"></i>fix in post</span>
          <span>upper bar = still · lower bar = clip</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------- QUEUE -->
  <section class="view" id="view-queue">
    <div class="wrap">
      <div class="section">
        <h2>Runner</h2>
        <div class="stats" id="queueStats"></div>
        <div id="runningBox"></div>
      </div>
      <div class="section">
        <h2>Pending</h2>
        <div id="queueTable"></div>
      </div>
      <div class="section">
        <h2>Failures</h2>
        <div class="log" id="failLog"></div>
      </div>
      <div class="section">
        <h2>Log</h2>
        <div class="log" id="runLog"></div>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ LEDGER -->
  <section class="view" id="view-ledger">
    <div class="wrap">
      <div class="section">
        <h2>Credits</h2>
        <div class="stats" id="ledgerStats"></div>
      </div>
      <div class="section">
        <h2>Defect frequency — a code that keeps recurring is a doctrine problem</h2>
        <div class="hist" id="histogram"></div>
      </div>
      <div class="section">
        <h2>Utilities</h2>
        <div class="toolrow">
          <button id="csImage">Contact sheet — stills</button>
          <button id="csVideo">Contact sheet — clips</button>
          <button id="valBtn">Validate manifest</button>
          <button id="bulkImage">Bulk approve C-tier stills</button>
          <button id="bulkVideo">Bulk approve C-tier clips</button>
        </div>
        <div id="toolOut"></div>
      </div>
    </div>
  </section>
</main>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const VIDEO_EXT = /\.(mp4|webm|mov|m4v)$/i;

const S = {
  tab: "review",
  stage: "image",
  filters: { state: "done", tier: "all", scene: "all", code: "all", flagged: false },
  rows: [],
  cursor: 0,
  meta: null,
  decisions: {},          // shot_id -> last decision made in this session
  poll: null,
};

/* --------------------------------------------------------------- helpers */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function toast(message, bad){
  const el = $("#toast");
  el.textContent = message;
  el.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = "toast"; }, bad ? 5000 : 2200);
}

async function api(path, options){
  const response = await fetch(path, options);
  let payload;
  try { payload = await response.json(); }
  catch (err) { throw new Error("bad response from " + path); }
  if (!response.ok || payload.ok === false) throw new Error(payload.error || "failed");
  return payload;
}

const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body),
});

function mediaURL(prefix, src){
  return prefix + src.split("/").map(encodeURIComponent).join("/");
}

/* Full resolution, plays immediately. For the inspector, where one shot has the
   whole screen. */
function mediaTag(src, autoplay){
  if (!src) return '<div class="nomedia">no media yet</div>';
  const url = mediaURL("/media/", src);
  if (VIDEO_EXT.test(src)) {
    return '<video src="' + esc(url) + '" muted loop playsinline ' +
      (autoplay ? "autoplay " : "") + 'preload="metadata"></video>';
  }
  return '<img src="' + esc(url) + '" alt="" loading="lazy">';
}

/* The grid. Forty of these can be on screen at once, so stills come from
   /thumb and clips carry no src at all until the observer hands them one. */
function tileMedia(src){
  if (!src) return '<div class="nomedia">no media yet</div>';
  const thumb = mediaURL("/thumb/", src);
  if (VIDEO_EXT.test(src)) {
    return '<video data-src="' + esc(mediaURL("/media/", src)) + '" poster="' +
      esc(thumb) + '" muted loop playsinline preload="none"></video>';
  }
  return '<img src="' + esc(thumb) + '" alt="" loading="lazy" decoding="async">';
}

/* ------------------------------------------------------------------ boot */
async function boot(){
  S.meta = await api("/api/codes");
  $("#brand").textContent = S.meta.project + " · panel";
  buildFilterOptions();
  wire();
  await Promise.all([loadReview(), loadCoverage()]);
  pollStatus();
  setInterval(pollStatus, 4000);
}

function buildFilterOptions(){
  const states = S.meta.states[S.stage];
  $("#fState").innerHTML = ['<option value="done">done — awaiting review</option>']
    .concat(states.filter(s => s !== "done")
      .map(s => '<option value="' + s + '">' + s + "</option>"))
    .concat(['<option value="all">all states</option>'])
    .join("");
  $("#fState").value = S.filters.state;
  $("#fTier").innerHTML = '<option value="all">all</option>' +
    S.meta.tiers.map(t => '<option value="' + t + '">' + t + "</option>").join("");
  $("#fCode").innerHTML = '<option value="all">all</option>' +
    S.meta.codes[S.stage].map(c =>
      '<option value="' + c.code + '">' + c.code + " " + c.label + "</option>").join("");
  $("#fTier").value = S.filters.tier;
  $("#fCode").value = S.filters.code;
}

function fillScenes(scenes){
  const current = $("#fScene").value || "all";
  $("#fScene").innerHTML = '<option value="all">all</option>' +
    scenes.map(s => '<option value="' + s + '">' + s + "</option>").join("");
  $("#fScene").value = scenes.map(String).includes(current) ? current : "all";
}

/* ---------------------------------------------------------------- review */
async function loadReview(keepCursor){
  const f = S.filters;
  const query = new URLSearchParams({
    state: f.state, tier: f.tier, scene: f.scene, code: f.code,
    flagged: f.flagged ? "1" : "all",
  });
  const endpoint = S.stage === "image" ? "/api/images" : "/api/videos";
  const previous = S.rows[S.cursor] && S.rows[S.cursor].shot_id;
  const payload = await api(endpoint + "?" + query.toString());
  S.rows = payload.records;
  if (keepCursor && previous) {
    const index = S.rows.findIndex(r => r.shot_id === previous);
    S.cursor = index >= 0 ? index : Math.min(S.cursor, S.rows.length - 1);
  } else {
    S.cursor = 0;
  }
  if (S.cursor < 0) S.cursor = 0;
  renderReview();
}

function renderReview(){
  const grid = $("#reviewGrid");
  if (!S.rows.length) {
    grid.innerHTML = '<div class="empty">Nothing matches these filters.<br>' +
      "The queue for this stage and state is empty.</div>";
    $("#reviewCount").textContent = "0 shots";
    observePlayback();
    return;
  }
  grid.innerHTML = S.rows.map((row, index) => tileHTML(row, index)).join("");
  $("#reviewCount").textContent = S.rows.length + " shots · " +
    S.rows.filter(r => r.record.state === "done").length + " undecided";
  focusCursor(false);
  observePlayback();
}

function tileHTML(row, index){
  const rec = row.record;
  const decision = S.decisions[row.shot_id];
  const codes = (rec.defects || []).slice(-1)[0];
  const cap = row.at_cap;
  const isVideo = row.stage === "video";

  let actions = "";
  if (decision && decision.routed_upstream) {
    actions = '<div class="route">Routed <b>upstream</b> — defect written to the ' +
      'still, clip record retired. <button class="chip" data-act="reroute-down">' +
      "send back to clip (T)</button></div>";
  } else if (cap && rec.state !== "approved") {
    actions =
      '<div class="capnote">' + rec.attempts + "/" + row.attempt_cap +
      " attempts — regeneration is closed for this stage.</div>" +
      '<div class="actions">' +
      '<button data-act="escape-reframe">Reframe ⇧R</button>' +
      '<button data-act="escape-cutaway">Cutaway ⇧C</button>' +
      (isVideo ? '<button data-act="fix-post">Fix in post ⇧P</button>' : "") +
      (rec.local_editable && rec.media
        ? '<button class="go" data-act="local-queue">Local edit ⇧L</button>' +
          '<span class="cost">' + row.estimate_local_edit + " cr</span>"
        : "") + "</div>";
  } else {
    const canQueue = rec.state === "rejected" || rec.state === "prompted";
    const canLocal = (rec.state === "done" || rec.state === "rejected") && rec.media;
    actions = '<div class="actions">' +
      '<button class="go" data-act="approve">Approve A</button>' +
      (canQueue
        ? '<button class="warn" data-act="regen">Re-roll R · ' +
          row.estimate_regenerate + " cr</button>"
        : "") +
      (canLocal && rec.local_editable
        ? '<button data-act="local-queue">Local edit ⇧L · ' +
          row.estimate_local_edit + " cr</button>"
        : "") +
      '<button data-act="flag">Flag F</button>' +
      '<button data-act="inspect">Inspect I</button>' +
      (isVideo && rec.state === "rejected"
        ? '<button data-act="reroute-up">Route upstream T</button>' : "") +
      "</div>";
  }

  return '<article class="tile' + (index === S.cursor ? " cursor" : "") +
    '" data-index="' + index + '" data-shot="' + esc(row.shot_id) + '" tabindex="-1">' +
    '<div class="media">' + tileMedia(rec.media) +
      '<div class="badges"><span class="shotid">' + esc(row.shot_id) + "</span>" +
      '<span class="tier ' + esc(row.tier || "") + '">' + esc(row.tier || "—") +
      "</span></div>" +
      '<div class="topright">' +
        (rec.flagged ? '<span class="flagbadge">⚑ Suhan</span>' : "") +
        '<span class="state ' + esc(rec.state) + '">' + esc(rec.state) + "</span>" +
      "</div>" +
    "</div>" +
    '<div class="meta">' +
      '<span class="attempts' + (cap ? " cap" : "") + '">' + rec.attempts + "/" +
        row.attempt_cap + "</span>" +
      (isVideo ? "<span>" + (rec.duration || "?") + "s</span>" : "") +
      '<span class="desc" title="' + esc(row.description) + '">' +
        esc(row.description || "—") + "</span>" +
      '<span class="codes">' + (codes ? codes.codes.map(c =>
        '<span class="code" title="' + esc((codeInfo(c) || {}).desc || "") + '">' +
        esc(c) + "</span>").join("") : "") + "</span>" +
    "</div>" + actions + "</article>";
}

function codeInfo(code){
  for (const stage of ["image", "video"]) {
    const found = S.meta.codes[stage].find(c => c.code === code);
    if (found) return found;
  }
  return null;
}

function focusCursor(scroll){
  $$(".tile").forEach(el => el.classList.toggle(
    "cursor", Number(el.dataset.index) === S.cursor));
  const el = $('.tile[data-index="' + S.cursor + '"]');
  if (el && scroll !== false) el.scrollIntoView({ block: "nearest" });
}

function move(delta){
  if (!S.rows.length) return;
  S.cursor = Math.max(0, Math.min(S.rows.length - 1, S.cursor + delta));
  focusCursor(true);
  reconcilePlayback();
}

/* ---------------------------------------------------------- clip playback */
/* A hundred clips in the DOM must not be a hundred clips being decoded. Only
   what is on screen gets a src, and never more than this many at once —
   browsers cap concurrent video decoders, and the failure mode when you cross
   the cap is tiles that silently never start. */
const PLAY_LIMIT = 12;
let observer = null;
const onScreen = new Set();

function observePlayback(){
  if (observer) observer.disconnect();
  onScreen.clear();
  const videos = $$("#reviewGrid video[data-src]");
  if (!videos.length) { observer = null; return; }
  observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (entry.isIntersecting) onScreen.add(entry.target);
      else { onScreen.delete(entry.target); detachClip(entry.target); }
    }
    reconcilePlayback();
  }, { root: null, rootMargin: "300px 0px", threshold: 0.05 });
  videos.forEach(video => observer.observe(video));
}

function reconcilePlayback(){
  if (!onScreen.size) return;
  const middle = window.innerHeight / 2;
  const ranked = Array.from(onScreen).sort((a, b) => distance(a, middle) -
    distance(b, middle));
  ranked.slice(0, PLAY_LIMIT).forEach(attachClip);
  // Evicting on a delay: moving the cursor across a row re-ranks everything
  // several times a second, and a clip that drops out of the top twelve for
  // 200ms should not have to decode itself from scratch on the way back.
  ranked.slice(PLAY_LIMIT).forEach(scheduleDetach);
}

const evicting = new Map();

function scheduleDetach(video){
  if (evicting.has(video)) return;
  evicting.set(video, setTimeout(() => {
    evicting.delete(video);
    detachClip(video);
  }, 400));
}

function distance(video, middle){
  const box = video.getBoundingClientRect();
  return Math.abs((box.top + box.bottom) / 2 - middle);
}

function attachClip(video){
  const pending = evicting.get(video);
  if (pending) { clearTimeout(pending); evicting.delete(video); }
  if (!video.getAttribute("src")) video.setAttribute("src", video.dataset.src);
  if (video.paused) video.play().catch(() => {});   // autoplay policy, muted
}

function detachClip(video){
  const pending = evicting.get(video);
  if (pending) { clearTimeout(pending); evicting.delete(video); }
  if (!video.getAttribute("src")) return;
  video.pause();
  video.removeAttribute("src");
  video.load();          // releases the decoder; the poster takes over again
}

function columns(){
  const grid = $("#reviewGrid");
  const style = getComputedStyle(grid);
  return Math.max(1, style.gridTemplateColumns.split(" ").length);
}

/* ------------------------------------------------------------- decisions */
async function decide(index, body){
  const row = S.rows[index];
  if (!row) return null;
  try {
    const result = await post("/api/review",
      Object.assign({ shot_id: row.shot_id, stage: row.stage }, body));
    S.decisions[row.shot_id] = result;
    await refreshRow(index, result);
    return result;
  } catch (err) {
    toast(err.message, true);
    return null;
  }
}

async function refreshRow(index, result){
  const row = S.rows[index];
  if (!row) return;
  // The upstream route retires the clip record, so the tile now speaks for the
  // still: further codes on this tile belong to the image stage.
  if (result && result.routed_upstream) {
    row.stage = "image";
    row.record = (await api("/api/shot?id=" + encodeURIComponent(row.shot_id))).image;
  } else if (result && result.restored) {
    row.stage = "video";
    row.record = (await api("/api/shot?id=" + encodeURIComponent(row.shot_id))).video;
  } else {
    const shot = await api("/api/shot?id=" + encodeURIComponent(row.shot_id));
    row.record = shot[row.stage] || row.record;
  }
  row.at_cap = row.record.attempts >= S.meta.attempt_cap;
  const el = $('.tile[data-index="' + index + '"]');
  if (el) {
    el.outerHTML = tileHTML(row, index);   // the old <video> node is gone with it
    focusCursor(false);
    observePlayback();
  }
}

async function applyCode(code){
  const row = S.rows[S.cursor];
  if (!row) return;
  const info = codeInfo(code);
  if (!info) return;
  const previous = S.decisions[row.shot_id];
  const merge = !!(previous && previous.state === "rejected");
  const result = await decide(S.cursor, { action: "reject", codes: [code], merge });
  if (!result) return;
  toast(row.shot_id + " rejected · " + (result.codes || [code]).join(" ") +
    (result.routed_upstream ? " → routed to the still" : "") +
    (result.at_cap ? " · at attempt cap" : ""));
}

async function approve(){
  const row = S.rows[S.cursor];
  if (!row) return;
  const result = await decide(S.cursor, { action: "approve" });
  if (!result) return;
  let message = row.shot_id + " approved";
  if (result.video && result.video.created) message += " · video record opened";
  if (result.video && result.video.stale_start_frame)
    message += " · clip start frame is now stale, see Coverage";
  toast(message);
  move(1);
}

async function queueWork(kind){
  const row = S.rows[S.cursor];
  if (!row) return;
  try {
    const result = await post("/api/queue",
      { shot_id: row.shot_id, stage: row.stage, kind });
    toast(row.shot_id + " queued · " + kind.replace("_", " ") + " · " +
      result.estimate + " cr projected · attempt " + result.attempts + "/" +
      S.meta.attempt_cap);
    await refreshRow(S.cursor, null);
    pollStatus();
  } catch (err) { toast(err.message, true); }
}

async function escapeHatch(kind){
  const row = S.rows[S.cursor];
  if (!row) return;
  const action = kind === "fix_in_post" ? "fix_in_post" : "escape_hatch";
  const result = await decide(S.cursor, { action, escape: { kind } });
  if (result) toast(row.shot_id + " → " + kind.replace(/_/g, " "));
}

async function reroute(direction){
  const row = S.rows[S.cursor];
  if (!row) return;
  const result = await decide(S.cursor,
    { action: "reroute", route: direction, stage: row.stage });
  if (result) {
    toast(row.shot_id + (direction === "image"
      ? " routed to the still — clip record retired"
      : " routed back to the clip"));
  }
}

/* ------------------------------------------------------------------ tabs */
function setTab(tab){
  S.tab = tab;
  $$("nav button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.tab === tab)));
  $$(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + tab));
  if (tab === "coverage") loadCoverage();
  if (tab === "ledger") loadLedger();
  if (tab === "queue") pollStatus();
}

/* -------------------------------------------------------------- coverage */
async function loadCoverage(){
  const data = await api("/api/coverage");
  const scenes = data.rows.map(r => r.scene).filter(s => s != null);
  fillScenes(scenes);

  const labels = {
    planned_no_image: ["Planned, no still prompted", "plan minus images"],
    image_approved_no_video: ["Still approved, no clip record", "the video queue"],
    stale_start_frame: ["Stale start frame",
      "the still was re-approved after the clip was made"],
    video_without_approved_still: ["Clip without an approved still",
      "inconsistent handoff"],
    orphan_image: ["Orphan still record", "no plan entry"],
    orphan_video: ["Orphan clip record", "no plan entry"],
    untiered: ["No tier assigned", "not A, B or C"],
    at_cap: ["At the attempt cap", "needs an escape hatch decision"],
  };
  $("#gapList").innerHTML = Object.keys(labels).map(key => {
    const items = data.gaps[key] || [];
    const chips = items.map(item => {
      const id = typeof item === "string" ? item : item.shot_id;
      const note = typeof item === "string" ? ""
        : (item.stage ? " " + item.stage : "");
      return '<button class="chip" data-shot="' + esc(id) + '">' + esc(id) +
        esc(note) + "</button>";
    }).join("");
    return '<div class="gaprow"><span class="gapname">' + labels[key][0] +
      "<small>" + labels[key][1] + "</small></span>" +
      '<span class="gapn ' + (items.length ? "hit" : "zero") + '">' +
      items.length + "</span>" +
      '<span class="chips">' + (chips || '<span class="count">clear</span>') +
      "</span></div>";
  }).join("");

  const width = Math.max(1, ...data.rows.map(r => r.shots.length));
  $("#covBody").innerHTML = data.rows.map(row => {
    const cells = [];
    for (let i = 0; i < width; i++) {
      const shot = row.shots[i];
      if (!shot) { cells.push("<td></td>"); continue; }
      const gap = !shot.image_state || shot.orphan || !shot.tier;
      cells.push('<td><div class="cell' + (gap ? " gap" : "") +
        '" data-shot="' + esc(shot.shot_id) + '">' +
        '<span class="cid">' + esc(shot.shot_id.split("_")[1]) +
        (shot.tier ? " " + esc(shot.tier) : " ?") +
        (shot.flagged ? " ⚑" : "") + "</span>" +
        '<span class="bars"><i class="bar" style="background:' +
          stateColor(shot.image_state) + '"></i></span>' +
        '<span class="bars"><i class="bar" style="background:' +
          stateColor(shot.video_state) + '"></i></span>' +
        '<span class="tt"><b>' + esc(shot.shot_id) + "</b> · tier " +
          esc(shot.tier || "—") + "<br>still: " + esc(shot.image_state || "no record") +
          "<br>clip: " + esc(shot.video_state || "no record") + "<br>" +
          esc(shot.description || "") + "</span>" +
        "</div></td>");
    }
    return "<tr><th>scene " + esc(row.scene) + "</th>" + cells.join("") + "</tr>";
  }).join("");
}

function stateColor(state){
  const map = {
    planned: "var(--planned)", prompted: "var(--prompted)", queued: "var(--queued)",
    done: "var(--done)", approved: "var(--approved)", rejected: "var(--rejected)",
    escape_hatch: "var(--escape)", fix_in_post: "var(--post)",
  };
  return map[state] || "#2a2a33";
}

/* ----------------------------------------------------------------- queue */
async function pollStatus(){
  let data;
  try { data = await api("/api/status"); } catch (err) { return; }
  const dot = $("#runnerDot");
  dot.className = "dot" + (data.runner.alive
    ? (data.runner.running ? " busy" : " on") : "");
  $("#runnerText").textContent = "runner " +
    (data.runner.alive ? (data.runner.driver || "up") : "down") +
    " · queue " + data.queue_depth;
  if (S.tab !== "queue") return;

  const counts = data.counts;
  const cell = (n, l, warn) => '<div class="stat' + (warn ? " warn" : "") +
    '"><div class="n">' + n + '</div><div class="l">' + l + "</div></div>";
  $("#queueStats").innerHTML =
    cell(data.queue_depth, "queued") +
    cell((counts.image.done || 0) + (counts.video.done || 0), "awaiting review") +
    cell((counts.image.approved || 0), "stills approved") +
    cell((counts.video.approved || 0), "clips approved") +
    cell(data.runner.failures.length, "failures", data.runner.failures.length > 0);

  $("#runningBox").innerHTML = data.runner.running
    ? '<div class="toolrow"><span class="pill"><span class="dot busy"></span>' +
      "running " + esc(data.runner.running.shot_id) + " · " +
      esc(data.runner.running.stage) + " · " + esc(data.runner.running.kind) +
      " · " + esc(data.runner.running.estimate) + " cr</span></div>"
    : '<div class="toolrow"><span class="count">runner idle</span></div>';

  $("#queueTable").innerHTML = data.queue.length
    ? '<table class="data"><thead><tr><th>shot</th><th>stage</th><th>kind</th>' +
      "<th>attempt</th><th>queued</th><th>estimate</th></tr></thead><tbody>" +
      data.queue.map(item => "<tr><td class=\"k mono\">" + esc(item.shot_id) +
        "</td><td>" + esc(item.stage) + "</td><td>" + esc(item.kind) +
        "</td><td>" + esc(item.attempts) + "/" + S.meta.attempt_cap +
        "</td><td>" + esc((item.queued_at || "").replace("T", " ").slice(0, 19)) +
        "</td><td>" + esc(item.estimate) + " cr</td></tr>").join("") +
      "</tbody></table>"
    : '<div class="toolrow"><span class="count">nothing pending</span></div>';

  $("#failLog").innerHTML = data.runner.failures.length
    ? data.runner.failures.slice().reverse().map(f =>
      '<div class="err">' + esc(f.at) + "  " + esc(f.shot_id) + " " + esc(f.stage) +
      "  " + esc(f.error) + "</div>").join("")
    : '<div>none</div>';
  $("#runLog").innerHTML = data.runner.log.length
    ? data.runner.log.slice().reverse().map(l =>
      "<div>" + esc(l.at) + "  " + esc(l.message) + "  " +
      esc(Object.keys(l).filter(k => k !== "at" && k !== "message")
        .map(k => k + "=" + l[k]).join(" ")) + "</div>").join("")
    : '<div>runner has not reported yet — start it with: python3 runner.py --watch</div>';
}

      "<tr><td class=\"k mono\">" + c.key + "</td><td class=\"k mono\">" + c.code +
      "</td><td class=\"k\">" + esc(c.label) + "</td><td>" + esc(c.desc) +
      "</td><td>" + (c.route === "image" && stage === "video"
        ? "routes upstream to the still" : "stays in " + stage) +
      "</td><td>" + (c.local_edit ? "locally editable" : "") + "</td></tr>").join(""))
      .join("") +
    "</tbody></table></div>";
  $("#scrim").classList.add("open");
}

function closeModal(){ $("#scrim").classList.remove("open"); }

/* ------------------------------------------------------------------ wire */
function wire(){
  $$("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $("#helpBtn").onclick = helpModal;
  $("#refreshBtn").onclick = () => loadReview(true);

  $$(".seg button").forEach(b => b.onclick = () => {
    S.stage = b.dataset.stage;
    $$(".seg button").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.stage === S.stage)));
    S.filters.state = "done";
    S.filters.code = "all";
    buildFilterOptions();
    loadReview();
  });

  $("#fState").onchange = e => { S.filters.state = e.target.value; loadReview(); };
  $("#fTier").onchange = e => { S.filters.tier = e.target.value; loadReview(); };
  $("#fScene").onchange = e => { S.filters.scene = e.target.value; loadReview(); };
  $("#fCode").onchange = e => { S.filters.code = e.target.value; loadReview(); };
  $("#fFlag").onchange = e => { S.filters.flagged = e.target.checked; loadReview(); };

  $("#reviewGrid").addEventListener("click", event => {
    const tile = event.target.closest(".tile");
    if (!tile) return;
    S.cursor = Number(tile.dataset.index);
    focusCursor(false);
    const button = event.target.closest("button[data-act]");
    if (!button) return;
    const act = button.dataset.act;
    if (act === "approve") approve();
    else if (act === "regen") queueWork("regenerate");
    else if (act === "local-queue") queueWork("local_edit");
    else if (act === "flag") decide(S.cursor, { action: "flag" });
    else if (act === "inspect") inspect(tile.dataset.shot);
    else if (act === "reroute-up") reroute("image");
    else if (act === "reroute-down") reroute("video");
    else if (act === "escape-reframe") escapeHatch("reframe");
    else if (act === "escape-cutaway") escapeHatch("cutaway");
    else if (act === "fix-post") escapeHatch("fix_in_post");
  });

  document.body.addEventListener("click", event => {
    const chip = event.target.closest("[data-shot]");
    if (chip && !event.target.closest(".tile")) inspect(chip.dataset.shot);
    if (event.target.closest('[data-act="close"]') || event.target.id === "scrim")
      closeModal();
  });

  $("#csImage").onclick = () => exportSheet("image");
  $("#csVideo").onclick = () => exportSheet("video");
  $("#valBtn").onclick = runValidator;
  $("#bulkImage").onclick = () => bulkApprove("image");
  $("#bulkVideo").onclick = () => bulkApprove("video");

  document.addEventListener("keydown", onKey);

  // Scrolling through a dense grid changes which clips are nearest the middle
  // without necessarily crossing an observer boundary.
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; reconcilePlayback(); });
  }, { passive: true });
}

async function exportSheet(stage){
  try {
    const result = await post("/api/export/contact_sheet", { stage });
    $("#toolOut").innerHTML = '<div class="toolrow"><a href="' + esc(result.url) +
      '" target="_blank">' + esc(result.path) + "</a></div>";
    toast("contact sheet written");
  } catch (err) { toast(err.message, true); }
}

async function runValidator(){
  try {
    const data = await api("/api/validate");
    $("#toolOut").innerHTML = data.issues.length
      ? data.issues.map(i => '<div class="issue ' + esc(i.level) + '">' +
        '<span class="lvl">' + esc(i.level) + '</span><span class="mono">' +
        esc(i.shot_id || "—") + "</span><span>" + esc(i.kind) + "</span><span>" +
        esc(i.detail) + "</span></div>").join("")
      : '<div class="toolrow"><span class="count">manifest is clean</span></div>';
    toast(data.counts.error + " errors, " + data.counts.warn + " warnings",
      data.counts.error > 0);
  } catch (err) { toast(err.message, true); }
}

async function bulkApprove(stage){
  if (!confirm("Approve every C-tier " + (stage === "image" ? "still" : "clip") +
    " that is awaiting review?")) return;
  try {
    const result = await post("/api/bulk_approve", { stage, tier: "C" });
    toast(result.approved.length + " approved, " + result.skipped.length + " skipped");
    if (S.tab === "review") loadReview(true);
    loadCoverage();
  } catch (err) { toast(err.message, true); }
}

let pendingTabKey = false;
function onKey(event){
  if (event.target.matches("input, select, textarea")) return;
  const key = event.key;

  if (key === "Escape") { closeModal(); pendingTabKey = false; return; }
  if ($("#scrim").classList.contains("open")) return;
  if (key === "?") { event.preventDefault(); return helpModal(); }

  if (pendingTabKey) {
    pendingTabKey = false;
    const map = { c: "coverage", r: "review", q: "queue", l: "ledger" };
    if (map[key.toLowerCase()]) { event.preventDefault(); return setTab(map[key.toLowerCase()]); }
  }
  if (key === "g") { pendingTabKey = true; return; }

  if (S.tab !== "review") return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  if (key >= "1" && key <= "9") {
    event.preventDefault();
    const entry = S.meta.codes[S.rows[S.cursor] ? S.rows[S.cursor].stage : S.stage]
      .find(c => c.key === key);
    if (entry) applyCode(entry.code);
    return;
  }
  switch (key) {
    case "ArrowRight": event.preventDefault(); return move(1);
    case "ArrowLeft": event.preventDefault(); return move(-1);
    case "ArrowDown": event.preventDefault(); return move(columns());
    case "ArrowUp": event.preventDefault(); return move(-columns());
    case "a": case "A": event.preventDefault(); return approve();
    case "f": case "F": event.preventDefault(); return decide(S.cursor, { action: "flag" });
    case "l": event.preventDefault(); return decide(S.cursor, { action: "local" });
    case "L": event.preventDefault(); return queueWork("local_edit");
    case "r": event.preventDefault(); return queueWork("regenerate");
    case "R": event.preventDefault(); return escapeHatch("reframe");
    case "C": event.preventDefault(); return escapeHatch("cutaway");
    case "P": event.preventDefault(); return escapeHatch("fix_in_post");
    case "t": case "T": {
      event.preventDefault();
      const row = S.rows[S.cursor];
      if (!row) return;
      const decision = S.decisions[row.shot_id];
      return reroute(decision && decision.routed_upstream ? "video" : "image");
    }
    case "i": case "I": {
      event.preventDefault();
      const row = S.rows[S.cursor];
      return row ? inspect(row.shot_id) : null;
    }
    case ".": event.preventDefault(); return loadReview(true);
  }
}

boot().catch(err => {
  document.body.insertAdjacentHTML("afterbegin",
    '<div class="empty">Could not reach the panel server.<br><br>' +
    "<code>python3 server.py --root .</code><br><br>" + esc(err.message) + "</div>");
});
</script>
</body>
</html>
